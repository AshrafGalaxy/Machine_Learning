name: Aegis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Build & Health Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Start backend server
        working-directory: ./backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &

      - name: Health check
        run: |
          # Dynamic waiting loop to accommodate 181MB Hugging Face model download
          for i in {1..15}; do
            response=$(curl -s http://localhost:8000/api/health || echo "failed")
            if [[ "$response" == *'"status":"healthy"'* ]]; then
              echo "Health response: $response"
              echo "Server is fully booted and healthy!"
              exit 0
            fi
            echo "Waiting for model download and server start... ($i/15)"
            sleep 5
            done
            echo "Server failed to start within 75 seconds."
            exit 1

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build all Docker images
        run: docker compose build

      - name: Build sandbox image
        run: docker build -f Dockerfile.sandbox -t aegis-sandbox:latest .
